zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: ed8b8d16b49849a68710cebebabf9305
      name: Custom
    - uuid: 919a8a3de4a54c6ab44688fbb8f5f464
      name: 'Templates/Network devices'
  templates:
    - uuid: c77f88c6c11b49e0bbfd253bfdd2f089
      template: 'Generic SNMP Interfaces'
      name: 'Generic SNMP Interfaces'
      groups:
        - name: Custom
        - name: 'Templates/Network devices'
      discovery_rules:
        - uuid: a584b97057444e3aa0f91ce979163ece
          name: 'Network Interfaces:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: f684bbd2f362498faba63aa3b371dff6
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
            - uuid: ecb2f2f55a7f4b2ba59ba71a3ad86946
              name: 'Interface {#IFNAME}: Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
            - uuid: dc15b159475b44ecb530b14d6200ee63
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '8'
                - type: CHANGE_PER_SECOND
            - uuid: f4d206c18d604bfe930d1a3cab1e23e2
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
            - uuid: 4c01c829d18c45f5b2442a2995489252
              name: 'Interface {#IFNAME}: Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              preprocessing:
                - type: CHANGE_PER_SECOND
            - uuid: 3a55a41c418549fe87e064f9dba38833
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '8'
                - type: CHANGE_PER_SECOND
            - uuid: 9bd14204825c458fab15dbbceece3ca3
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              trends: '0'
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
            - uuid: 1374cf9b841a4f6e84c35bc8a2d5bbef
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
            - uuid: 5f88c136659c4c8db268f44244697ca4
              name: 'Interface {#IFNAME}: Interface type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
          graph_prototypes:
            - uuid: 44dcced280154dafa16dd60562de4f09
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: '274482'
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: F63100
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: 2774A4
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: 6C59DC
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
                - sortorder: '5'
                  color: AC8C14
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
            - uuid: 3ff54a7c92f84ff6bbff2a4671aeff14
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational Status: ({#IFOPERSTATUS})'
              yaxismax: '2'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'Generic SNMP Interfaces'
                    key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
      tags:
        - tag: build
          value: custom
      dashboards:
        - uuid: 8b7495ebd51246958a9c6c273c476137
          name: Interfaces
          pages:
            - widgets:
                - type: graphprototype
                  width: '72'
                  height: '60'
                  fields:
                    - type: GRAPH_PROTOTYPE
                      name: graphid.0
                      value:
                        host: 'Generic SNMP Interfaces'
                        name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
                    - type: STRING
                      name: reference
                      value: LGNSE
                    - type: INTEGER
                      name: rows
                      value: '10'
        - uuid: dca763c1d40f40b6b46def725454fed0
          name: 'Interface Status'
          auto_start: 'NO'
          pages:
            - widgets:
                - type: graphprototype
                  name: 'Interface {#IFNAME}: Operational Status 1=up, 2=down'
                  width: '72'
                  height: '30'
                  fields:
                    - type: INTEGER
                      name: columns
                      value: '3'
                    - type: GRAPH_PROTOTYPE
                      name: graphid.0
                      value:
                        host: 'Generic SNMP Interfaces'
                        name: 'Interface {#IFNAME}({#IFALIAS}): Operational Status: ({#IFOPERSTATUS})'
                    - type: STRING
                      name: reference
                      value: VDBDG
                    - type: INTEGER
                      name: rows
                      value: '10'
