zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: ed8b8d16b49849a68710cebebabf9305
      name: Custom
    - uuid: 919a8a3de4a54c6ab44688fbb8f5f464
      name: 'Templates/Network devices'
  templates:
    - uuid: 02bb6fe18c1a4c96b06309ead053d62f
      template: 'FS S5800'
      name: 'FS S5800'
      description: 'This template is used for FS S5800 series devices.'
      groups:
        - name: Custom
        - name: 'Templates/Network devices'
      items:
        - uuid: df007ae80e8f48d2bbc11933f8d1c085
          name: 'Device Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.37.1.3.1.4.1.1.1
          key: devMSlotEnvironmentValue
          delay: 2m
          history: 7d
          trends: '0'
          units: C
          triggers:
            - uuid: 60f6f1e0b88c4dc8b13f87240e0a1e34
              expression: 'last(/FS S5800/devMSlotEnvironmentValue)>60 and last(/FS S5800/devMSlotEnvironmentValue)<80'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/FS S5800/devMSlotEnvironmentValue)<60'
              name: 'Device Temperature Over 60 Degrees'
              priority: WARNING
              manual_close: 'YES'
            - uuid: ae67bb587c644277a44b3b955f7c7f8c
              expression: 'last(/FS S5800/devMSlotEnvironmentValue)>80 and last(/FS S5800/devMSlotEnvironmentValue)<100'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/FS S5800/devMSlotEnvironmentValue)<80'
              name: 'Device Temperature Over 80 Degrees'
              priority: AVERAGE
              manual_close: 'YES'
            - uuid: b902558b9b1c4b6abadb6b0a3f0f9071
              expression: 'last(/FS S5800/devMSlotEnvironmentValue)>100'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/FS S5800/devMSlotEnvironmentValue)<100'
              name: 'Device Temperature Over 100 Degrees'
              priority: HIGH
              manual_close: 'YES'
        - uuid: fe1ca0d6e7f04d6791b32dde9756a4c8
          name: 'Device Mac'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.17.1.1.0
          key: dot1dBaseBridgeAddress
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'The interface''s address at its protocol sub-layer.  For example, for an 802.x interface, this object normally contains a MAC address.  The interface''s media-specific MIB must define the bit and byte ordering and the format of the value of this object.  For interfaces which do not have such an address (e.g., a serial line), this object should contain an octet string of zero length.'
          inventory_link: MACADDRESS_A
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: ac93e39ec6394fa989f859d6466f0d1e
          name: CPUUtilization5Sec
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.9.1.0
          key: fiveSeconds
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: '%'
          description: 'This is the CPU utilization for 5 seconds.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value.replace(''%'','''');'
          tags:
            - tag: Application
              value: 'Device info'
          triggers:
            - uuid: 16a1add98b0042a4accf1a3d53b23fef
              expression: 'last(/FS S5800/fiveSeconds)>=90'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/FS S5800/fiveSeconds)<90'
              name: 'CPU Utilization Over 90%'
              priority: HIGH
              description: 'When the temperature is greater than or equal to 90%, the alarm will be restored when it is less than 90%.'
        - uuid: ab47663d7de645d7a69302aba70b08f0
          name: 'Flash Free'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.5.1.1.1.1.3.1
          key: flhFree
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'Specifies the free size of the flash device.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: c207a4a3697345ce9c9c39e0b9a97c9d
          name: 'Flash Size'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.5.1.1.1.1.2.1
          key: flhSize
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'Return the flash size of the system.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 337806537489407cbc8be9c0fa6afd84
          name: 'Flash Size Utilisation'
          type: CALCULATED
          key: flhUtil
          delay: 2m
          history: 7d
          value_type: TEXT
          status: DISABLED
          params: 'last(//flhFree) / last(//flhSize) * 100'
          description: 'Return the flash size of the system.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 3a122d71346e42638680987238f88fa9
          name: 'Device HwVersion'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.37.1.5.1.8.1.1
          key: lswSlotHwVer
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'The hardware version of the card in this slot. If the line card is absent, none info will be printed.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 55bd10052e0a4a02a2eb80a6c6606331
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.37.1.5.1.10.1.1
          key: lswSlotSerialNo
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'The serial number of the card in this Slot. If the line card is absent, none info will be printed.'
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: 'Device info'
          triggers:
            - uuid: f6c25d444fc345c1a522ce53d9233fd6
              expression: 'change(/FS S5800/lswSlotSerialNo) and length(last(/FS S5800/lswSlotSerialNo))>0'
              name: 'Device Serial Number Has Changed'
              priority: INFO
              description: 'The serial number of the system has changed. The device was probably replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
        - uuid: 38a4fb6aefe74c42b7916ce8e16313c2
          name: 'Memory Free'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.1.11.0
          key: memTotalFree
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: MB
          description: 'This is the memory size that is free.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value/1024;'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: b22d7d5b0b334652ad6d312813ea10bc
          name: 'Memory Size'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.1.5.0
          key: memTotalReal
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: MB
          description: 'This is the size of physical memory .'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value/1024;'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: c3cd3ee24c35430284a69e943058e945
          name: 'Memory Used'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.1.12.0
          key: memTotalUsed
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: MB
          description: 'The value is current memory usage size.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value/1024;'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 69c3c9e01ef0407eb44f51615c815bf0
          name: 'Memory Utilisation'
          type: CALCULATED
          key: memTotalUtil
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: '%'
          params: 'last(//memTotalFree) / last(//memTotalReal) * 100'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return value/1024;'
          tags:
            - tag: Application
              value: 'Device info'
          triggers:
            - uuid: 01b6f3aa6cdc4b7985ff55ce1e52f02a
              expression: 'last(/FS S5800/memTotalUtil)>80'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/FS S5800/memTotalUtil)<80'
              name: 'Memory Utilisation Over 80%'
              priority: HIGH
        - uuid: d344546858084ea3b3899beae1521166
          name: 'Device Location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: sysLocation
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'The physical location of this node (e.g., ''telephone closet, 3rd floor'').  If the location is unknown, the value is the zero-length string.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: dbe6a35c595748c788a56d708acdb693
          name: 'Device Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: sysName
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'An administratively-assigned name for this managed node.  By convention, this is the node''s fully-qualified domain name.  If the name is unknown, the value is the zero-length string.'
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 4a4ef42c3a304d2dbb3c283d8e8eeeb7
          name: SysUptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sysUpTime
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'The time (in hundredths of a second) since the network management portion of the system was last re-initialized.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  value = value/100;
                  var theTime = parseInt(value);// 秒
                  var theTime1 = 0;// 分
                  var theTime2 = 0;// 小时
                  // alert(theTime);
                  if(theTime > 60) {
                  theTime1 = parseInt(theTime/60);
                  theTime = parseInt(theTime%60);
                  // alert(theTime1+"-"+theTime);
                  if(theTime1 > 60) {
                  theTime2 = parseInt(theTime1/60);
                  theTime1 = parseInt(theTime1%60);
                  }
                  }
                  var result = ""+parseInt(theTime)+"s";
                  if(theTime1 > 0) {
                  result = ""+parseInt(theTime1)+"m"+result;
                  }
                  if(theTime2 > 0) {
                  result = ""+parseInt(theTime2)+"h"+result;
                  }
                  return result; 
                  
          tags:
            - tag: Application
              value: 'Device info'
        - uuid: 8f2ed8ec247c429eb717517a9965383a
          name: 'Device SwVersion'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.52642.1.1.3.5.0
          key: version
          delay: 2m
          history: 7d
          value_type: TEXT
          description: 'Return the string of the Revision number of software resides on the FastSwitch.'
          inventory_link: SOFTWARE
          tags:
            - tag: Application
              value: 'Device info'
          triggers:
            - uuid: ca8d98a31847480fbb8d646299f42d6f
              expression: 'change(/FS S5800/version) and length(last(/FS S5800/version))>0'
              name: 'Device OS Version Has Changed'
              priority: INFO
              description: 'The OS version of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
      discovery_rules:
        - uuid: 78fe138689e14dcd9ae0a338922d0931
          name: 'Tempelature:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMPERATURE},1.3.6.1.4.1.52642.1.37.1.3.1.4]'
          key: device.temperature.discovery
          delay: 2m
          status: DISABLED
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 4c06702650c9459d87e14bcd5b181756
              name: 'Device{#SNMPINDEX}Tempeature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.3.1.4.{#SNMPINDEX}'
              key: 'device.tempeature.[devMSlotEnvironmentValue.{#SNMPINDEX}]'
              delay: 2m
              status: DISABLED
              discover: NO_DISCOVER
              units: ℃
              description: 'Environment value.'
              tags:
                - tag: Application
                  value: 'Device info'
          graph_prototypes:
            - uuid: c6943314d3b44f3a922b4be10d623d34
              name: 'Device{#SNMPINDEX}Tempeature'
              graph_items:
                - color: '002600'
                  item:
                    host: 'FS S5800'
                    key: 'device.tempeature.[devMSlotEnvironmentValue.{#SNMPINDEX}]'
        - uuid: 09c84743bafe4d379e21ee740df51823
          name: 'Fan Info:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FANSPEED},1.3.6.1.4.1.52642.1.37.1.1.1.1.5,{#FANSTATUS},1.3.6.1.4.1.52642.1.37.1.1.1.1.4]'
          key: fan.info.discovery
          delay: 2m
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 437e1fead1a64809b5a77a2e03118842
              name: 'Fan{#SNMPINDEX} Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.1.1.1.5.{#SNMPINDEX}'
              key: 'fan.info.fanspeed.[devMFanSpeed.{#SNMPINDEX}]'
              delay: 2m
              value_type: TEXT
              description: 'Whether fan support speed adjust, 0 mean unsupport, 1 mean support.'
              tags:
                - tag: Application
                  value: Fan
            - uuid: 63673302df5e42e79cdce0d8c3c02b89
              name: 'Fan{#SNMPINDEX} Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.1.1.1.4.{#SNMPINDEX}'
              key: 'fan.info.fanstatus.[devMFanStatus.{#SNMPINDEX}]'
              delay: 2m
              value_type: TEXT
              description: 'FanStatus : active (1), deactive (2) not installed (3) and unsupported (4).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value=="1") {
                      		return "active";
                      	}else if(value=="2"){
                      		return "deactive";
                      	}else if(value=="3"){
                      		return "not installed";
                      	}else if(value=="4"){
                      		return "unsupport";
                      	}
              tags:
                - tag: Application
                  value: Fan
        - uuid: 71c5589096f14e1bb0300210edb4ad38
          name: 'Fiber DDM:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FIBERTEMPERATURE},1.3.6.1.4.1.52642.1.37.1.10.2.1.5,{#BIASCURRENT},1.3.6.1.4.1.52642.1.37.1.10.4.1.5,{#BIASVOLTAGE},1.3.6.1.4.1.52642.1.37.1.10.3.1.5,{#TXPOWER},1.3.6.1.4.1.52642.1.37.1.10.5.1.5,{#RXPOWER},1.3.6.1.4.1.52642.1.37.1.10.6.1.5]'
          key: fiber.ddm.discovery
          delay: 2m
          filter:
            conditions:
              - macro: '{#BIASVOLTAGE}'
                value: '([1-9]\d*(\.\d*[1-9])?)|(0\.\d*[1-9])'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 9d0d3fa1297340adb5dfc712e53dff3d
              name: 'Fiber{#SNMPINDEX} BiasCurrent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.10.4.1.5.{#SNMPINDEX}'
              key: 'fiber.ddm.biascurrent.[biasCurrent.{#SNMPINDEX}]'
              delay: 2m
              value_type: FLOAT
              units: mA
              description: 'Transceiver  currently bias value, unit is mA(milliamperes). Display 4 vlaue in the case of 40G/100G fiber.'
              tags:
                - tag: Application
                  value: Fiber
            - uuid: 72ee9f7176c0401e92b910ab810e96e6
              name: 'Fiber{#SNMPINDEX} BiasVoltage'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.10.3.1.5.{#SNMPINDEX}'
              key: 'fiber.ddm.biasvoltage.[voltageCurrent.{#SNMPINDEX}]'
              delay: 2m
              value_type: FLOAT
              units: V
              description: 'Transceiver  currently voltage value, unit is Voltage. Display 4 vlaue in the case of 40G/100G fiber.'
              tags:
                - tag: Application
                  value: Fiber
            - uuid: 2233f219828d4c90a5801439ca4e9af8
              name: 'Fiber{#SNMPINDEX} Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.10.2.1.5.{#SNMPINDEX}'
              key: 'fiber.ddm.temperature.[temperCurrent.{#SNMPINDEX}]'
              delay: 2m
              value_type: FLOAT
              units: ℃
              description: 'Transceiver  currently temperature value,unit is Celsius . Display 4 vlaue in the case of 40G/100G fiber.'
              tags:
                - tag: Application
                  value: Fiber
            - uuid: 277cc487586f45fa96ba9d6b0384e56f
              name: 'Fiber{#SNMPINDEX} RxPower'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.10.6.1.5.{#SNMPINDEX}'
              key: 'fiber.ddm.txpower.[receivepowerCurrent.{#SNMPINDEX}]'
              delay: 2m
              value_type: FLOAT
              units: db
              description: 'Transceiver currently receive power value, unit is dBm. Display 4 vlaue in the case of 40G/100G fiber.'
              tags:
                - tag: Application
                  value: Fiber
            - uuid: fcefd5a667454404a5ac063f9bd510ed
              name: 'Fiber{#SNMPINDEX} TxPower'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.10.5.1.5.{#SNMPINDEX}'
              key: 'fiber.ddm.txpower.[transpowerCurrent.{#SNMPINDEX}]'
              delay: 2m
              value_type: FLOAT
              units: db
              description: 'Transceiver currently transmit power value, unit is dBm. Display 4 vlaue in the case of 40G/100G fiber.'
              tags:
                - tag: Application
                  value: Fiber
        - uuid: d4bc1393c6634dec8015fd09995fbdd6
          name: 'Network Interfaces:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
            - uuid: a94c606fa89f43c0b2c9c5d545f02c45
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              description: |
                MIB: IF-MIB
                The number of inbound packets which were chosen to be discarded
                even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.
                One possible reason for discarding such a packet could be to free up buffer space.
                Discontinuities in the value of this counter can occur at re-initialization of the management system,
                and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: 4d3f7cfa975f430ca61b2f73068c42e0
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: 581bb7cc056240679f7e1fa6180295ca
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets received on the interface, including framing characters. This object is a 64-bit version of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: 9a9e26bd3fe04b5f9c994352d6e5c472
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              description: |
                MIB: IF-MIB
                The number of outbound packets which were chosen to be discarded
                even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.
                One possible reason for discarding such a packet could be to free up buffer space.
                Discontinuities in the value of this counter can occur at re-initialization of the management system,
                and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: 0e20d81cf30a4c5c97643d059cccafc2
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of outbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: f7128eb2738449f4be94c3853876bfd8
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 7d
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit version of ifOutOctets.Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: dc45d930cc304e748d2b83e2f4923b9e
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              trends: '0'
              units: bps
              description: |
                MIB: IF-MIB
                An estimate of the interface's current bandwidth in units of 1,000,000 bits per second. If this object reports a value of `n' then the speed of the interface is somewhere in the range of `n-500,000' to`n+499,999'.  For interfaces which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain the nominal bandwidth. For a sub-layer which has no concept of bandwidth, this object should be zero.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
            - uuid: 3cf7ef37b63447eabda63c9be26af67c
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 2m
              history: 7d
              trends: '0'
              description: |
                MIB: IF-MIB
                The current operational state of the interface.
                - The testing(3) state indicates that no operational packet scan be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
              trigger_prototypes:
                - uuid: 7c20bd5e8ff24e69930bc5e30766c4ce
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))=1)'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2'
                  name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. Can be triggered if operations status is down.
                    2. {$IFCONTROL:"{#IFNAME}"}=1 - user can redefine Context macro to value - 0. That marks this interface as not important. No new trigger will be fired if this interface is down.
                    3. {TEMPLATE_NAME:METRIC.diff()}=1) - trigger fires only if operational status was up(1) sometime before. (So, do not fire 'ethernal off' interfaces.)
                    
                    WARNING: if closed manually - won't fire again on next poll, because of .diff.
                  manual_close: 'YES'
            - uuid: abb0e721efc34c8ca6f8abc917f41487
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              trends: '0'
              description: |
                MIB: IF-MIB
                The type of interface.
                Additional values for ifType are assigned by the Internet Assigned NumbersAuthority (IANA),
                through updating the syntax of the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
          trigger_prototypes:
            - uuid: c13eb294884a43aaa35d8ff3b07c5f38
              expression: |
                change(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
                and (
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=62 or
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=69 or
                last(/FS S5800/net.if.type[ifType.{#SNMPINDEX}])=117
                )
                and
                (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)
              name: 'Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Ack to close.'
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))=1)'
                  recovery_expression: 'last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2'
            - uuid: f510cf0f2d1f43c8aa696ef302396b2a
              expression: |
                (avg(/FS S5800/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/FS S5800/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/FS S5800/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/FS S5800/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FS S5800/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'Interface {#IFNAME}({#IFALIAS}): High bandwidth usage ( > {$IF.UTIL.MAX:"{#IFNAME}"}% )'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The network interface utilization is close to its estimated maximum bandwidth.'
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))=1)'
                  recovery_expression: 'last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2'
            - uuid: 09d9adcdf9d6431fba5c22c2d83c6195
              expression: |
                min(/FS S5800/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/FS S5800/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/FS S5800/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/FS S5800/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}({#IFALIAS}): High error rate ( > {$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Recovers when below 80% of {$IF.ERRORS.WARN:"{#IFNAME}"} threshold'
              dependencies:
                - name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))=1)'
                  recovery_expression: 'last(/FS S5800/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2'
          graph_prototypes:
            - uuid: d208c5cfef804c998d5a01d6909858f3
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'FS S5800'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 2774A4
                  item:
                    host: 'FS S5800'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: F63100
                  yaxisside: RIGHT
                  item:
                    host: 'FS S5800'
                    key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: A54F10
                  yaxisside: RIGHT
                  item:
                    host: 'FS S5800'
                    key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: FC6EA3
                  yaxisside: RIGHT
                  item:
                    host: 'FS S5800'
                    key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'FS S5800'
                    key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
        - uuid: f8dba937806f44f6b5a3f49af527b21f
          name: 'Supply Info:discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUPPLYSTATUS},1.3.6.1.4.1.52642.1.37.1.2.1.2]'
          key: supply.status.discovery
          delay: 2m
          lifetime: 30d
