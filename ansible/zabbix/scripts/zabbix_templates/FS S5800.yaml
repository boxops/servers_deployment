              name: 'Supply{#SNMPINDEX} Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.52642.1.37.1.2.1.2.{#SNMPINDEX}'
              key: 'supply.info.supplystatus.[devMPowerStatus.{#SNMPINDEX}]'
              delay: 2m
              value_type: TEXT
              description: 'Power whole device status: present (1), absent (2), unsupport (3).'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value=="1") {
                      		return "present";
                      	}else if(value=="2"){
                      		return "absent";
                      	}else if(value=="3"){
                      		return "unsupport";
                      	}
              tags:
