zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: ed8b8d16b49849a68710cebebabf9305
      name: Custom
    - uuid: 919a8a3de4a54c6ab44688fbb8f5f464
      name: 'Templates/Network devices'
  templates:
    - uuid: b7dd8d3dca074a70848d62200e011e05
      template: 'Dasan V5800 by SNMP'
      name: 'Dasan V5800 by SNMP'
      description: 'Dasan (Keymile) OLT - V5808 and V5816 series'
      groups:
        - name: Custom
        - name: 'Templates/Network devices'
      items:
        - uuid: dbfcecb2ec014f9eaf91248280ed6822
          name: 'CPU Load Avg 1 Min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6296.9.1.1.1.9.0
          key: dsCpuLoad1m
          delay: 2m
          history: 7d
          value_type: FLOAT
          trends: '0'
          units: '%'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: source
              value: cpu
          triggers:
            - uuid: d5b642a74e8342f0b7f76678a2e23aee
              expression: 'last(/Dasan V5800 by SNMP/dsCpuLoad1m)>80'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Dasan V5800 by SNMP/dsCpuLoad1m)<80'
              name: 'CPU Load (1min) Is Above 80%'
              priority: HIGH
              tags:
                - tag: source
                  value: health
        - uuid: 582a45a59cad4ba3b201f02c306b40ca
