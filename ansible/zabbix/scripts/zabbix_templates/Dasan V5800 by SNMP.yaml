                  parameters:
                    - 1h
              tags:
                - tag: source
                  value: dsFanTable
          trigger_prototypes:
            - uuid: 435ad9d98f774b2d81afbfe950573830
              expression: 'last(/Dasan V5800 by SNMP/dsFaninstalled[{#SNMPVALUE}])=1 and last(/Dasan V5800 by SNMP/dsFanstatus[{#SNMPVALUE}])=2'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Dasan V5800 by SNMP/dsFaninstalled[{#SNMPVALUE}])=1 and last(/Dasan V5800 by SNMP/dsFanstatus[{#SNMPVALUE}])=1'
              name: 'Faulty Fan At Position {#SNMPVALUE}'
              priority: INFO
              manual_close: 'YES'
          graph_prototypes:
            - uuid: 1a66662eb2734553a599c55da5e7d0c2
              name: 'Fans Status / Installed'
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1A7C11
                  item:
                    host: 'Dasan V5800 by SNMP'
                    key: 'dsFaninstalled[{#SNMPVALUE}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: '274482'
                  item:
                    host: 'Dasan V5800 by SNMP'
                    key: 'dsFanstatus[{#SNMPVALUE}]'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 7e6a3090ff434c06a839633011c1a22a
