              parameters:
                - 1h
          tags:
            - tag: source
              value: version
          triggers:
            - uuid: 9875f3ea443143aaa7db844eee977919
              expression: 'change(/Dasan V5800 by SNMP/sleSystemOSVersion) and length(last(/Dasan V5800 by SNMP/sleSystemOSVersion))>0'
              name: 'Device OS Version Has Changed'
              priority: INFO
              description: 'The OS version of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
        - uuid: 360d1e88db5044caa0428b0a596b97f0
          name: 'Serial Number'
