          snmp_oid: .1.3.6.1.4.1.6296.9.1.1.2.5.1.3.1.1
          key: dsTemperatureStatus
          delay: 5m
          history: 7d
          trends: '0'
          units: C
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: source
              value: temperature
          triggers:
            - uuid: bc15c69016e348d4a63d38ead2d372ef
              expression: 'last(/Dasan V5800 by SNMP/dsTemperatureStatus)>60 and last(/Dasan V5800 by SNMP/dsTemperatureStatus)<80'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Dasan V5800 by SNMP/dsTemperatureStatus)<60'
              name: 'Device Temperature Over 60 Degrees'
              priority: WARNING
              manual_close: 'YES'
              tags:
                - tag: source
                  value: health
            - uuid: aa8e43b905cb49c8ad3e046f12d3ac40
