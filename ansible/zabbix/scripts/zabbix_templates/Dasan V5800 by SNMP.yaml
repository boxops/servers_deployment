              recovery_expression: 'last(/Dasan V5800 by SNMP/dsTemperatureStatus)<80'
              name: 'Device Temperature Over 80 Degrees'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: source
                  value: health
            - uuid: 607cd8c0d107473fa8a0aaa8df9abeb1
