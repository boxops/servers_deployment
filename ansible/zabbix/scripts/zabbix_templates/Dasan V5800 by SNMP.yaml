              expression: 'change(/Dasan V5800 by SNMP/sleSystemSerialNumber) and length(last(/Dasan V5800 by SNMP/sleSystemSerialNumber))>0'
              name: 'Device Serial Number Has Changed'
              opdata: '{#SNMPVALUE}'
              priority: INFO
              description: 'The serial number of the system has changed. The device was probably replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
      discovery_rules:
        - uuid: 76d73c2d94394a77bfc824de28a8a4d4
          name: 'Fan Table Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.6296.9.1.1.2.7.1.2]'
          key: dsFanTable.discovery
          delay: 24h
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            Defaults:
            FanStartTemperature = 30
            FanStopTemperature = 0
          item_prototypes:
            - uuid: 5a17b8ba231b48ecb019dcf502b04975
              name: 'Fan Installed {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6296.9.1.1.2.7.1.4.{#SNMPINDEX}'
              key: 'dsFaninstalled[{#SNMPVALUE}]'
              delay: 10m
              trends: '0'
              valuemap:
                name: dsFaninstalled
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: source
                  value: dsFanTable
            - uuid: 3d0309410a4f4d0181e3ded38fc45021
              name: 'Fan Status {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6296.9.1.1.2.7.1.3.{#SNMPINDEX}'
              key: 'dsFanstatus[{#SNMPVALUE}]'
