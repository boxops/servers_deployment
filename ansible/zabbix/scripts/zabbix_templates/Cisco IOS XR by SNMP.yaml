zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: ed8b8d16b49849a68710cebebabf9305
      name: Custom
    - uuid: 919a8a3de4a54c6ab44688fbb8f5f464
      name: 'Templates/Network devices'
  templates:
    - uuid: 69355ce156d3433792c75971a4187059
      template: 'Cisco IOS XR by SNMP'
      name: 'Cisco IOS XR by SNMP'
      description: |
        Template Cisco IOS Software releases 12.2(3.5) or later
        
        MIBs used:
        CISCO-MEMORY-POOL-MIB
        IF-MIB
        EtherLike-MIB
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        CISCO-ENVMON-MIB
        CISCO-PROCESS-MIB
        ENTITY-MIB
        
        Known Issues:
        
          Description: no if(in|out)(Errors|Discards) are available for vlan ifType
          Version: IOS for example: 12.1(22)EA11, 15.4(3)M2
          Device: C2911, C7600
        
        Generated by official Zabbix template tool "Templator"
      vendor:
        name: Zabbix
        version: 7.2-1
      groups:
        - name: Custom
        - name: 'Templates/Network devices'
      items:
        - uuid: 7014e997bbcc46b8af7f2139cd9799d9
          name: 'Running Config Last Changed'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.9.9.43.1.1.1.0
          key: ccmHistoryRunningLastChanged
          delay: 10m
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: configuration
          triggers:
            - uuid: 76ce342b35d640c0b6879fc25ad20951
              expression: 'last(/Cisco IOS XR by SNMP/ccmHistoryRunningLastChanged)>0 and last(/Cisco IOS XR by SNMP/ccmHistoryRunningLastChanged)<10m'
              name: 'Cisco IOS XR: Running configuration has changed'
              event_name: 'Cisco IOS XR: Running configuration on {HOST.NAME} has changed (time < 10m)'
              priority: INFO
              description: 'Uptime is less than 10 minutes.'
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco IOS XR: No SNMP data collection'
                  expression: 'max(/Cisco IOS XR by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: cb4d1a81d2664eff8daa0592e29d3513
          name: 'Running Config Last Saved'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.9.9.43.1.1.2.0
          key: ccmHistoryRunningLastSaved
          delay: 10m
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: configuration
          triggers:
            - uuid: 4c114f4311ad44cab68f45b408eca063
              expression: 'last(/Cisco IOS XR by SNMP/ccmHistoryRunningLastSaved)>0 and last(/Cisco IOS XR by SNMP/ccmHistoryRunningLastSaved)<10m'
              name: 'Cisco IOS XR: Running configuration was saved'
              event_name: 'Cisco IOS XR: Running configuration on {HOST.NAME} was saved (time < 10m)'
              priority: INFO
              description: 'Uptime is less than 10 minutes.'
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco IOS XR: No SNMP data collection'
                  expression: 'max(/Cisco IOS XR by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: 49197fcf29724e62b31c279e9dbd7e14
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: 2m
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 4068b940f3be425f8a22bd4c7fae9972
              expression: 'max(/Cisco IOS XR by SNMP/icmpping,#3)=0'
              name: 'Cisco IOS XR: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout.  Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: b0f60e929b8e47dab6e56154fd32cb92
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: 2m
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: c646e151974840d697f92fbe70a250ea
              expression: 'min(/Cisco IOS XR by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco IOS XR by SNMP/icmppingloss,5m)<100'
              name: 'Cisco IOS XR: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Cisco IOS XR: Unavailable by ICMP ping'
                  expression: 'max(/Cisco IOS XR by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: d1ac4b2ae28044d0a105455c8a3cad30
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: 2m
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: ef933f4143264341b0bc2e6915b10299
              expression: 'avg(/Cisco IOS XR by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Cisco IOS XR: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Cisco IOS XR: High ICMP ping loss'
                  expression: 'min(/Cisco IOS XR by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco IOS XR by SNMP/icmppingloss,5m)<100'
                - name: 'Cisco IOS XR: Unavailable by ICMP ping'
                  expression: 'max(/Cisco IOS XR by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: f6f60d95fe21490a90901a81930bdace
          name: 'Cisco IOS XR: SNMP walk EtherLike-MIB interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.10.7.2.1.19,1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2]'
          key: net.if.duplex.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'Discovering interfaces from IF-MIB and EtherLike-MIB. Interfaces with `up(1)` Operational Status are discovered.'
          tags:
            - tag: component
              value: raw
        - uuid: d0ab3ebc641d40baa88be50ced79f63d
          name: 'Cisco IOS XR: SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'Discovering interfaces from IF-MIB.'
          tags:
            - tag: component
              value: raw
        - uuid: 7d77a8fb13a94206881c15e0ee032450
          name: 'Cisco IOS XR: SNMP walk fans'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.13.1.4.1.2,1.3.6.1.4.1.9.9.13.1.4.1.3]'
          key: sensor.fans.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'Discovering system fans.'
          tags:
            - tag: component
              value: raw
        - uuid: 8923ce2e0e2945a1adc99d811c69b8a9
          name: 'Cisco IOS XR: SNMP walk PSUs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.13.1.5.1.2,1.3.6.1.4.1.9.9.13.1.5.1.3]'
          key: sensor.psu.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'The table of power supply status maintained by the environmental monitor card.'
          tags:
            - tag: component
              value: raw
        - uuid: 14ff37353d5640e1b917455321df07b9
          name: 'Cisco IOS XR: SNMP walk temperature sensors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.13.1.3.1.2,1.3.6.1.4.1.9.9.13.1.3.1.3,1.3.6.1.4.1.9.9.13.1.3.1.6]'
          key: sensor.temp.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'Discovery of ciscoEnvMonTemperatureTable (ciscoEnvMonTemperatureDescr), a table of ambient temperature status maintained by the environmental monitor.'
          tags:
            - tag: component
              value: raw
        - uuid: 296ede8d3d6945d1b3001970e3e317f1
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: c3949e12811a4d329dc3d7b96ed36677
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.4.0
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The textual identification of the contact person for this managed node, together with information on how to contact this person.  If no contact information is known, the value is the zero-length string.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: aa72652fccd047e9a66ec45526dfe80a
          name: 'Cisco IOS XR: SNMP walk system CPUs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.109.1.1.1.1.2,1.3.6.1.4.1.9.9.109.1.1.1.1.7,1.3.6.1.4.1.9.9.109.1.1.1.1.8,1.3.6.1.4.1.9.9.109.1.1.1.1.31]'
          key: system.cpu.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: |
            If your IOS device has several CPUs, you must use CISCO-PROCESS-MIB and its object cpmCPUTotal5minRev from the table called cpmCPUTotalTable,
            indexed with cpmCPUTotalIndex.
            This table allows CISCO-PROCESS-MIB to keep CPU statistics for different physical entities in the router,
            like different CPU chips, group of CPUs, or CPUs in different modules/cards.
            In case of a single CPU, cpmCPUTotalTable has only one entry.
          tags:
            - tag: component
              value: raw
        - uuid: 7a61e832b8754e02ad724a91f2633b38
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: eb94416998f44feeaec619dc2c564589
          name: 'Hardware model name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.13.1
          key: system.hw.model
          delay: 1h
          value_type: CHAR
          description: 'MIB: ENTITY-MIB'
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: c26a2184914449d99d0b8f2c84d4e052
          name: 'Hardware serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.11.1
          key: system.hw.serialnumber
          delay: 1h
          value_type: CHAR
          description: 'MIB: ENTITY-MIB'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: ef2598ae8cad4dfcb49e6db3d3ce3ea8
              expression: 'last(/Cisco IOS XR by SNMP/system.hw.serialnumber,#1)<>last(/Cisco IOS XR by SNMP/system.hw.serialnumber,#2) and length(last(/Cisco IOS XR by SNMP/system.hw.serialnumber))>0'
              name: 'Cisco IOS XR: Device has been replaced'
              event_name: 'Cisco IOS XR: Device has been replaced (new serial number received)'
              priority: INFO
              description: 'Device serial number has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 42945b1bbdb04feeb5c174ca5c6294a3
          name: 'Cisco IOS XR: SNMP walk entity serial numbers'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.47.1.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.7,1.3.6.1.2.1.47.1.1.1.1.11]'
          key: system.hw.serialnumber.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: |
            MIB: ENTITY-MIB
            Entity Serial Numbers Discovery.
          tags:
            - tag: component
              value: raw
        - uuid: 61b6d118f7a9414abc9505a820ea64c0
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.1.1.0
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 2m
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 9c55b0286eb04617b0157f5ef10055cb
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: daf177336bf140eeba1a53627a116bbb
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name.  If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 44d40a6f93ff469fbe1a475705055d07
              expression: 'last(/Cisco IOS XR by SNMP/system.name,#1)<>last(/Cisco IOS XR by SNMP/system.name,#2) and length(last(/Cisco IOS XR by SNMP/system.name))>0'
              name: 'Cisco IOS XR: System name has changed'
              event_name: 'Cisco IOS XR: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 46d1e18513234323b79a413a4968b63b
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 2m
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 5fee8704f51948c0bc6b8bf3b86a3724
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity.  This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 5b1e779280594113add6b53ccc0e7fc8
          name: 'Operating system'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.sw.os[sysDescr.0]'
          delay: 1h
          value_type: CHAR
          description: 'MIB: SNMPv2-MIB'
          inventory_link: OS
          preprocessing:
            - type: REGEX
              parameters:
                - 'Version (.+)'
                - \1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: c29d26475e2c474982a20378ffba51d8
              expression: 'last(/Cisco IOS XR by SNMP/system.sw.os[sysDescr.0],#1)<>last(/Cisco IOS XR by SNMP/system.sw.os[sysDescr.0],#2) and length(last(/Cisco IOS XR by SNMP/system.sw.os[sysDescr.0]))>0'
              name: 'Cisco IOS XR: Operating system description has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Cisco IOS XR: System name has changed'
                  expression: 'last(/Cisco IOS XR by SNMP/system.name,#1)<>last(/Cisco IOS XR by SNMP/system.name,#2) and length(last(/Cisco IOS XR by SNMP/system.name))>0'
              tags:
                - tag: scope
                  value: notice
        - uuid: c27569ccdaff4c27a4e10c7bed6fe58b
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          delay: 2m
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 0ae4599ef54f46c282caf5de8e6da6f7
              expression: 'max(/Cisco IOS XR by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Cisco IOS XR: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Cisco IOS XR: Unavailable by ICMP ping'
                  expression: 'max(/Cisco IOS XR by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 1ff16afb8fbf41be85fadd180a52bd8d
          name: cempMemPool
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.9.9.221.1.1.1.1.3]'
          key: cempMemPool.discovery
          delay: 1h
          item_prototypes:
            - uuid: 1e88a25f9a9344e7994ae3e91797e280
              name: 'cempMemPoolAlternate {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.221.1.1.1.1.5.{#SNMPINDEX}'
              key: 'cempMemPoolAlternate[{#SNMPVALUE}]'
              delay: 2m
              history: 7d
              value_type: FLOAT
              trends: '0'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: source
                  value: cempMemPool
            - uuid: a1cf949303a847e9a992711f1076d6d3
              name: 'cempMemPoolFree {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.221.1.1.1.1.8.{#SNMPINDEX}'
              key: 'cempMemPoolFree[{#SNMPVALUE}]'
              delay: 2m
              history: 7d
              value_type: FLOAT
              trends: '0'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: source
                  value: cempMemPool
            - uuid: 3b494c5e6e544a8a946acd50b924f8a1
              name: 'cempMemPoolHCFree {#SNMPVALUE}'
