---
# Update configs only
# ansible-playbook -i inventories/production/hosts.yml deploy.yml --tags "config"
- name: Deploy Oxidized Infrastructure
  hosts: all
  become: true
  gather_facts: true
  
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install basic packages
      apt:
        name:
          - curl
          - wget
          - gnupg
          - software-properties-common
        state: present

- name: Deploy Oxidized Server
  hosts: oxidized_servers
  become: true
  roles:
    - oxidized
