---
- name: Ensure firewalld is installed
  apt:
    name: firewalld
    state: present
    update_cache: true

- name: Ensure firewalld service is running and enabled
  service:
    name: firewalld
    state: started
    enabled: true
 
- name: Configure UniFi firewalld ports
  ansible.builtin.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    zone: "{{ unifi_firewalld_zone }}"
    state: enabled
    permanent: true
  loop: "{{ unifi_firewalld_ports }}"
  notify: Reload firewalld
