[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --strict-markers

markers =
    unit: Unit tests (mock all external dependencies)
    integration: Integration tests (require real services)
    slow: Tests that take longer to run

[coverage:run]
source =
    scripts
    ansible/kea_dhcp/scripts
    ansible/zabbix/scripts
    ansible/oxidized/scripts
omit =
    tests/*
    */__pycache__/*
    */.*

[coverage:report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    def __repr__
    raise NotImplementedError
    pass
